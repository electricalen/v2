schema-version = "1.12.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
go.pkg-path = "go"
postgresql.pkg-path = "postgresql"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
POSTGRES_HOST = "localhost"
POSTGRES_PORT = "15432"
POSTGRES_USER = "miniflux"
POSTGRES_DB = "miniflux"
POSTGRES_PASSWORD = "secret"
DATABASE_URL = "postgres://miniflux:secret@localhost:15432/miniflux?sslmode=disable"
LISTEN_ADDR = "127.0.0.1:8080"
RUN_MIGRATIONS = "1"
CREATE_ADMIN = "1"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "adminadmin"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
# on-activate = '''
#   # -> Set variables, create files and directories
#   # -> Perform initialization steps, e.g. create a python venv
#   # -> Useful environment variables:
#   #      - FLOX_ENV_PROJECT=/home/user/example
#   #      - FLOX_ENV=/home/user/example/.flox/run
#   #      - FLOX_ENV_CACHE=/home/user/example/.flox/cache
# '''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
# common = '''
#   gum style \
#   --foreground 212 --border-foreground 212 --border double \
#   --align center --width 50 --margin "1 2" --padding "2 4" \
#     $INTRO_MESSAGE
# '''
## Shell-specific customizations such as setting aliases go here:
# bash = ...
# zsh  = ...
# fish = ...


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services.postgres]
command = '''
  PGDATA="$FLOX_ENV_CACHE/postgres/data"
  PGRUN="$FLOX_ENV_CACHE/postgres/run"
  mkdir -p "$PGRUN"
  if [ ! -d "$PGDATA" ]; then
    initdb -D "$PGDATA" --username="$POSTGRES_USER" --auth=trust --no-locale --encoding=UTF8
    echo "CREATE DATABASE $POSTGRES_DB;" > "$PGRUN/init.sql"
    pg_ctl -D "$PGDATA" -o "-k $PGRUN -h '' -p $POSTGRES_PORT" -l "$PGRUN/init.log" start
    until psql -h "$PGRUN" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d postgres -c '\q' 2>/dev/null; do sleep 0.5; done
    psql -h "$PGRUN" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d postgres -f "$PGRUN/init.sql"
    psql -h "$PGRUN" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d postgres -c "ALTER USER $POSTGRES_USER WITH PASSWORD '$POSTGRES_PASSWORD';"
    pg_ctl -D "$PGDATA" stop
  fi
  exec postgres -D "$PGDATA" -k "$PGRUN" -h "$POSTGRES_HOST" -p "$POSTGRES_PORT"
'''
is-daemon = true

[services.postgres.shutdown]
command = '''pg_ctl -D "$FLOX_ENV_CACHE/postgres/data" stop -m fast'''

[services.miniflux]
command = '''
  mkdir -p "$FLOX_ENV_CACHE/bin" "$FLOX_ENV_CACHE/logs"
  BIN="$FLOX_ENV_CACHE/bin/miniflux"
  if [ ! -x "$BIN" ] || [ "$(find "$FLOX_ENV_PROJECT" -name '*.go' -newer "$BIN" -print -quit 2>/dev/null)" ]; then
    (cd "$FLOX_ENV_PROJECT" && go build -o "$BIN" main.go)
  fi
  until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" >/dev/null 2>&1; do sleep 0.5; done
  exec "$BIN" 2>&1 | tee -a "$FLOX_ENV_CACHE/logs/miniflux.log"
'''


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
